<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level-Test — AI Performance Academy</title>
<meta name="description" content="Finde in 8 Klicks heraus, wo du gerade mit KI stehst.">
<meta property="og:title" content="Level-Test — AI Performance Academy">
<meta property="og:description" content="Finde in 8 Klicks heraus, wo du gerade mit KI stehst.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'><path d='M 6 32 A 26 26 0 0 1 58 32' fill='none' stroke='%23000' stroke-width='3'/><path d='M 50 32 A 26 26 0 0 1 58 32 L 56 28 L 50 30 Z' fill='%23E10600'/><line x1='32' y1='32' x2='40' y2='14' stroke='%23000' stroke-width='2.5' stroke-linecap='round'/><circle cx='32' cy='32' r='2.5' fill='%23000'/></svg>">
<style>
  :root {
    --bg: #FAFAFA;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F4F4F5;
    --gray: #767D8C;
    --gray-light: #525968;
    --gray-dark: #E5E7EB;
    --white: #0A0A0A;
    --white-muted: #1F2937;
    --primary: #FF1A1A;
    --primary-light: #FF4444;
    --primary-dark: #CC1515;
    --anfaenger: #16A34A;
    --fortgeschritten: #D97706;
    --experte: #DC2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--white-muted);
    line-height: 1.6;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::selection { background: var(--primary); color: #fff; }

  /* ===== Page-Wrapper ===== */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px 24px;
  }
  .frame {
    width: 100%;
    max-width: 760px;
    min-height: 640px;
    background: var(--bg-card);
    border: 1.5px solid var(--primary);
    border-radius: 18px;
    padding: 60px 48px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .frame > .screen.active { flex: 1; display: flex; flex-direction: column; }
  /* Q1 (Splitter mit answer-grid): drei gleich große Lücken —
     Progress → Titel-Block → Karten → Karten-Unterseite.
     Titel sitzt damit mittig zwischen Progress und Karten;
     Karten sitzen mittig zwischen Titel und Karten-Unterseite.
     Keyhint ist absolut am unteren Rand und nicht Teil der Verteilung. */
  .frame > .screen.active:has(.answer-grid) .q-heading { margin-top: auto; }
  .frame > .screen.active:has(.answer-grid) .answer-grid {
    margin-top: auto;
    margin-bottom: auto;
  }
  .frame > .screen.active:has(.answer-grid) .keyhint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    margin: 0;
  }
  /* Q2–Q8: drei gleichmäßige Lücken (Headline-Gruppe / Antworten / Footer). */
  .frame > .screen.active:has(.answer-list) .q-heading { margin-top: auto; }
  .frame > .screen.active:has(.answer-list) .answer-list { margin-top: auto; }
  .frame > .screen.active:has(.answer-list) .screen-footer { margin-top: auto; }
  /* Result-Screen: Inhalt komplett vertikal zentrieren. */
  .frame > .screen.active:has(.result) { justify-content: center; }

  /* ===== Screens (only one active) ===== */
  .screen { display: none; animation: fadeIn 0.32s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Progress ===== */
  .progress {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .progress .step {
    font-size: 11px;
    color: var(--gray);
    font-weight: 700;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .progress .bar {
    flex: 1;
    height: 4px;
    background: var(--gray-dark);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress .fill {
    height: 100%;
    background: var(--primary);
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    border-radius: 2px;
  }

  /* ===== Question heading ===== */
  .q-heading {
    font-size: clamp(1.5rem, 3.2vw, 2.15rem);
    font-weight: 900;
    color: var(--white);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .q-heading .accent { color: var(--primary); }
  .q-sub {
    font-size: 16px;
    color: var(--gray-light);
    margin: 0 0 28px;
    max-width: 600px;
    font-weight: 400;
  }

  /* ===== Q1 Splitter cards ===== */
  .answer-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .answer-card {
    background: var(--bg-card);
    border: 2px solid var(--gray-dark);
    border-radius: 14px;
    padding: 22px 20px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
    font-family: inherit;
    color: inherit;
    width: 100%;
    display: block;
  }
  .answer-card:hover, .answer-card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(15,23,42,0.08);
    border-color: var(--lvl-color, var(--gray));
    background: var(--bg-card-hover);
    outline: none;
  }
  .answer-card.lvl-anf { --lvl-color: var(--anfaenger); }
  .answer-card.lvl-fg  { --lvl-color: var(--fortgeschritten); }
  .answer-card.lvl-exp { --lvl-color: var(--experte); }

  .answer-card .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    background: color-mix(in srgb, var(--lvl-color) 12%, transparent);
    color: var(--lvl-color);
    border: 1px solid color-mix(in srgb, var(--lvl-color) 40%, transparent);
  }
  .answer-card .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .answer-card .title {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--white);
    margin-bottom: 8px;
  }
  .answer-card .desc {
    font-size: 14.5px;
    color: var(--gray-light);
    line-height: 1.5;
  }

  /* ===== Q2-Q8 list answers ===== */
  .answer-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .answer-row {
    background: var(--bg-card);
    border: 2px solid var(--gray-dark);
    border-radius: 12px;
    padding: 15px 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: inherit;
    color: inherit;
    width: 100%;
    text-align: left;
  }
  .answer-row:hover, .answer-row:focus-visible {
    border-color: var(--primary);
    background: var(--bg-card-hover);
    outline: none;
  }
  .answer-row .letter {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--gray);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: var(--gray-light);
    font-size: 13px;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .answer-row:hover .letter, .answer-row:focus-visible .letter {
    border-color: var(--primary);
    color: var(--primary);
  }
  .answer-row .text {
    font-size: 17px;
    color: var(--white-muted);
    font-weight: 500;
  }

  /* ===== Footer of screen (back button) ===== */
  .screen-footer {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--gray);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .btn-back {
    font-family: inherit;
    background: transparent;
    border: 1px solid var(--gray-dark);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 11px;
    color: var(--gray-light);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .btn-back:hover { border-color: var(--gray); color: var(--white); }

  /* ===== Result Screen ===== */
  .result {
    text-align: center;
    padding: 12px 0 4px;
  }
  .result .stamp {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 22px;
    border: 2px solid;
  }
  .result .stamp.anf { color: var(--anfaenger); border-color: var(--anfaenger); background: color-mix(in srgb, var(--anfaenger) 10%, transparent); }
  .result .stamp.fg  { color: var(--fortgeschritten); border-color: var(--fortgeschritten); background: color-mix(in srgb, var(--fortgeschritten) 10%, transparent); }
  .result .stamp.exp { color: var(--experte); border-color: var(--experte); background: color-mix(in srgb, var(--experte) 10%, transparent); }
  .result .stamp .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

  .result .headline {
    font-size: clamp(1.85rem, 4.2vw, 2.85rem);
    font-weight: 900;
    color: var(--white);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 12px;
  }
  .result .headline .level-word.anf { color: var(--anfaenger); }
  .result .headline .level-word.fg  { color: var(--fortgeschritten); }
  .result .headline .level-word.exp { color: var(--experte); }
  .result .qualifier {
    font-size: 17px;
    color: var(--gray-light);
    font-weight: 600;
    margin: 0 0 16px;
    max-width: 600px;
    margin-left: auto; margin-right: auto;
  }
  .result .body {
    font-size: 16.5px;
    color: var(--gray-light);
    max-width: 600px;
    margin: 0 auto 28px;
    line-height: 1.6;
    font-weight: 400;
  }

  /* ===== CTA-Stack auf Ergebnis-Seite ===== */
  .cta-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .cta-primary {
    font-family: inherit;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px 32px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(255,26,26,0.12);
  }
  .cta-primary:hover {
    background: var(--primary-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,26,26,0.22);
  }
  .cta-primary .arrow {
    transition: transform 0.2s;
    display: inline-block;
  }
  .cta-primary:hover .arrow { transform: translateX(4px); }

  .cta-secondary-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-secondary {
    font-family: inherit;
    background: transparent;
    color: var(--white-muted);
    border: 1px solid var(--gray);
    padding: 11px 22px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--white); color: var(--white); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-card);
    border: 1px solid var(--primary);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(15,23,42,0.12);
    z-index: 200;
    transition: transform 0.32s cubic-bezier(.4,0,.2,1), opacity 0.32s;
    opacity: 0;
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ===== Tastaturhinweis ===== */
  .keyhint {
    text-align: center;
    margin-top: 18px;
    font-size: 11px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .keyhint kbd {
    display: inline-block;
    padding: 2px 7px;
    background: var(--gray-dark);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    color: var(--white-muted);
    margin: 0 2px;
  }

  /* ===== Kompakter Modus für Laptops mit niedriger Bildschirmhöhe ===== */
  @media (max-height: 1000px) and (min-width: 721px) {
    .stage { padding: 16px 24px; align-items: flex-start; }
    .frame { padding: 44px 42px; min-height: 560px; }
    .progress { margin-bottom: 22px; }
    .q-heading { font-size: clamp(1.4rem, 2.6vw, 1.8rem); }
    .q-sub { font-size: 15px; margin-bottom: 22px; }
    .answer-card { padding: 18px 16px; }
    .answer-card .pill { margin-bottom: 10px; }
    .answer-card .title { font-size: 1rem; margin-bottom: 6px; }
    .answer-card .desc { font-size: 13.5px; }
    .answer-row { padding: 13px 18px; }
    .answer-row .text { font-size: 15.5px; }
    .answer-row .letter { width: 28px; height: 28px; font-size: 12px; }
    .screen-footer { margin-top: 20px; }
    .keyhint { margin-top: 12px; font-size: 10.5px; }
    .result { padding: 4px 0 0; }
    .result .stamp { margin-bottom: 16px; padding: 7px 16px; font-size: 10.5px; }
    .result .headline { font-size: clamp(1.6rem, 3.4vw, 2.3rem); margin-bottom: 10px; }
    .result .qualifier { font-size: 15px; margin-bottom: 14px; }
    .result .body { font-size: 15px; margin-bottom: 20px; }
    .cta-primary { padding: 12px 26px; font-size: 12.5px; }
  }

  /* Sehr flache Screens: kompakteres Layout. */
  @media (max-height: 740px) and (min-width: 721px) {
    .stage { padding: 20px 24px; }
    .frame { padding: 26px 32px; min-height: 460px; }
    .progress { margin-bottom: 14px; }
    .q-heading { font-size: clamp(1.15rem, 2vw, 1.4rem); }
    .q-sub { font-size: 13.5px; margin-bottom: 14px; }
    .answer-card { padding: 14px 14px; }
    .answer-card .desc { font-size: 13px; }
    .answer-row { padding: 10px 14px; }
    .answer-row .text { font-size: 14px; }
    .keyhint { display: none; }
  }

  /* ===== Mobile ===== */
  @media (max-width: 720px) {
    body { font-size: 16px; }
    .frame { padding: 36px 24px 36px; border-radius: 0; border: none; }
    .stage { padding: 30px 0; }
    .answer-grid { grid-template-columns: 1fr; gap: 12px; }
    .answer-card { padding: 22px 18px; }
    .q-heading { font-size: 1.6rem; }
    .answer-row { padding: 16px 18px; }
    .answer-row .text { font-size: 16px; }
    .q-sub { font-size: 16px; }
    .result .body { font-size: 16.5px; }
    .result .qualifier { font-size: 17px; }
    .cta-primary { padding: 12px 24px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame" id="frame"></div>
</div>

<div class="toast" id="toast">Ergebnis kopiert</div>

<script>
  // ===========================================================
  // Konstanten
  // ===========================================================

  const TOTAL_STEPS = 8;          // 1 Splitter + 7 Folgefragen
  const AKADEMIE_URL = 'https://ai-pa.ai/akademie/';

  const LEVELS = {
    anf: { name: 'Anfänger', cls: 'anf' },
    fg:  { name: 'Fortgeschritten', cls: 'fg' },
    exp: { name: 'Experte', cls: 'exp' }
  };

  // Q1 — Selbsteinschätzung als Hypothese
  const Q1 = {
    headline: ['Wo siehst du dich gerade', 'mit KI?'],
    sub: 'Stuf dich grob ein — am Ende prüfen wir, ob du richtig liegst.',
    options: [
      { cls: 'anf', pill: 'Anfänger',       title: 'Ich fange gerade an',  desc: 'Wenig oder keine Erfahrung mit KI — ich will wissen, wie ich starte.', value: 'anf' },
      { cls: 'fg',  pill: 'Fortgeschritten', title: 'Ich nutze KI bereits', desc: 'Ich arbeite damit, will aber systematisch besser werden.',              value: 'fg'  },
      { cls: 'exp', pill: 'Experte',         title: 'Ich gehe in die Tiefe', desc: 'Ich arbeite tief mit KI und will mich spezialisieren.',                 value: 'exp' }
    ]
  };

  // Q2–Q8 — universelle Folgefragen für alle, mit progressiver Tiefe
  const QUESTIONS = [
    // Q2 — Frequenz (Komfort)
    {
      headline: ['Wie oft nutzt du KI', 'in deinem Alltag?'],
      sub: 'Eine Frage, eine Antwort — direkt zur nächsten.',
      options: [
        { letter: 'A', text: 'Selten — ich habe es ab und zu probiert',   score: -1 },
        { letter: 'B', text: 'Mehrmals pro Woche, je nach Aufgabe',       score:  0 },
        { letter: 'C', text: 'Täglich, fast in jedem Arbeitsblock',       score:  1 }
      ]
    },
    // Q3 — Tool-Vielfalt (Komfort)
    {
      headline: ['Mit wie vielen KI-Tools', 'arbeitest du regelmäßig?'],
      sub: 'Nebeneinander, je nach Aufgabe.',
      options: [
        { letter: 'A', text: 'Eines, meist ChatGPT',                              score: -1 },
        { letter: 'B', text: 'Zwei oder drei, je nach Zweck',                     score:  0 },
        { letter: 'C', text: 'Vier oder mehr — jedes mit klarem Use Case',        score:  1 }
      ]
    },
    // Q4 — Prompt-Qualität (Erste Tiefe)
    {
      headline: ['Wie schreibst du', 'einen typischen Prompt?'],
      sub: 'Wie viel Struktur gibst du der KI mit auf den Weg?',
      options: [
        { letter: 'A', text: 'So, wie ich die Frage einem Kollegen stellen würde',         score: -1 },
        { letter: 'B', text: 'Mit etwas Kontext, manchmal Beispielen',                     score:  0 },
        { letter: 'C', text: 'Mit Rolle, Kontext, Beispielen und gewünschtem Format',      score:  1 }
      ]
    },
    // Q5 — Output-Validierung (Erste Tiefe)
    {
      headline: ['Wenn KI dir antwortet —', 'was machst du damit?'],
      sub: 'Vertrauen, prüfen, gegenchecken — wie ist deine Routine?',
      options: [
        { letter: 'A', text: 'Ich übernehme sie meistens direkt',                  score: -1 },
        { letter: 'B', text: 'Ich überfliege und prüfe stichprobenartig',          score:  0 },
        { letter: 'C', text: 'Ich habe feste Prüfschritte — Quellen, Gegenproben', score:  1 }
      ]
    },
    // Q6 — Kontext-Setup (Differenzierer)
    {
      headline: ['Arbeitest du mit', 'System Prompts oder Projects?'],
      sub: 'Also: Gibst du der KI feste Regeln und Wissen mit, bevor du loslegst?',
      options: [
        { letter: 'A', text: 'Davon habe ich noch nicht gehört',         score: -1 },
        { letter: 'B', text: 'Manchmal, für wiederkehrende Themen',      score:  0 },
        { letter: 'C', text: 'Ja, feste Setups pro Use Case',            score:  1 }
      ]
    },
    // Q7 — Workflow-Automation (Differenzierer)
    {
      headline: ['Hast du eigene Workflows', 'oder Automationen gebaut?'],
      sub: 'z. B. mit n8n, Zapier, Make oder Custom Skills — etwas, das wiederholt für dich arbeitet.',
      options: [
        { letter: 'A', text: 'Noch nicht — ich nutze KI im Chat',                     score: -1 },
        { letter: 'B', text: 'Erste Versuche, einzelne Sachen funktionieren',         score:  0 },
        { letter: 'C', text: 'Ja, läuft produktiv und spart messbar Zeit',            score:  1 }
      ]
    },
    // Q8 — Eigene Werkzeuge & Agenten (Experten-Schicht)
    {
      headline: ['Hast du eigene KI-Werkzeuge', 'oder Agenten gebaut?'],
      sub: 'z. B. Custom Skills, MCP-Server, Multi-Agent-Setups — Tools, die deine KI bekommt, statt nur fertige Apps zu nutzen.',
      options: [
        { letter: 'A', text: 'Habe ich noch nicht gehört',                  score: -1 },
        { letter: 'B', text: 'Habe es probiert, einzelne Sachen laufen',    score:  0 },
        { letter: 'C', text: 'Ja, mehrere Agenten produktiv im Einsatz',    score:  1 }
      ]
    }
  ];

  // ===========================================================
  // Outcomes — 9 Varianten (selfPick × actualLevel)
  // Schwellen: score ≤ −3 → anf, −2..+3 → fg, ≥ +4 → exp
  // ===========================================================

  const RESULTS = {
    // Diagonale: Selbsteinschätzung trifft zu
    anf_anf: { level: 'anf', headline: 'Du hattest recht — du bist Anfänger.',           qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Der richtige Startpunkt, um KI systematisch und ohne Umwege zu lernen. Du weißt, wo du stehst — das ist die halbe Miete.' },
    fg_fg:   { level: 'fg',  headline: 'Du hattest recht — du bist Fortgeschritten.',     qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Du nutzt KI bereits und kennst die Kerntechniken. Jetzt geht’s um Tiefe und die Anwendung in deinen eigenen Prozessen.' },
    exp_exp: { level: 'exp', headline: 'Du hattest recht — du bist Experte.',             qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Du arbeitest tief mit KI, baust eigene Systeme und gibst Wissen weiter. Jetzt geht’s um Spezialisierung — Multi-Agent, Custom Skills, KI-Strategie auf höchster Ebene.' },

    // Untertrieben: Du bist weiter, als du dachtest
    anf_fg:  { level: 'fg',  headline: 'Du bist weiter, als du dachtest — Fortgeschritten.', qualifier: 'Mehr drauf, als deine Selbsteinschätzung vermuten ließ.',
               body: 'Einige Bausteine hast du längst im Griff. Auf dem Fortgeschritten-Weg holst du gezielt das raus, was den nächsten Schritt ausmacht.' },
    anf_exp: { level: 'exp', headline: 'Riesige Überraschung — du bist eigentlich Experte.', qualifier: 'Selten gesehen: Du hast dich deutlich unterschätzt.',
               body: 'Was du im Alltag tust, ist Experten-Niveau — Agenten, eigene Tools, klare Setups. Du brauchst keinen Einstieg, du brauchst Spezialisierung.' },
    fg_exp:  { level: 'exp', headline: 'Du bist weiter, als du dachtest — Experte.',         qualifier: 'Deine Selbsteinschätzung war zu bescheiden.',
               body: 'Du orchestrierst Agenten, baust eigene Werkzeuge und kennst die fortgeschrittenen Techniken aus dem Effeff. Der Experten-Weg holt aus dir mehr raus.' },

    // Überschätzt: würdig, ohne „du lagst falsch"
    fg_anf:  { level: 'anf', headline: 'Du bringst Anspruch mit — im Alltag stehst du noch auf Anfänger-Niveau.', qualifier: 'Du arbeitest mit KI, der systematische Aufbau fehlt aber noch.',
               body: 'Genau der richtige Punkt, um Grundlagen sauber aufzubauen. Mit deinem Mindset und ein bisschen Struktur wirst du sehr schnell sehr weit kommen.' },
    exp_anf: { level: 'anf', headline: 'Du bist Anfänger — mit dem Anspruch eines Experten.', qualifier: 'Im Alltag stehst du gerade noch im Aufbau.',
               body: 'Genau hier hat ein systematischer Einstieg den größten Hebel. Mit deinem Anspruch wirst du den Weg zum Experten viel schneller gehen als die meisten.' },
    exp_fg:  { level: 'fg',  headline: 'Aktuell bist du Fortgeschritten.',                    qualifier: 'In einigen Bereichen bist du schon weit — der Sprung zum Experten steht bevor.',
               body: 'Die Basis ist da. Was noch fehlt, sind die letzten Bausteine — eigene Werkzeuge, Multi-Agent, strategische Tiefe. Dort holst du gezielt das raus, was den Sprung ausmacht.' }
  };

  // ===========================================================
  // State
  // ===========================================================

  const state = {
    selfPick: null,    // 'anf' | 'fg' | 'exp'
    answers: [],       // Array<-1|0|1>, Länge bis zu 7
    step: 0            // 0 = Q1; 1..7 = Q2..Q8; 8 = Result
  };

  // ===========================================================
  // Logik: Score → Level → Outcome
  // ===========================================================

  function scoreToLevel(score) {
    if (score <= -3) return 'anf';
    if (score >=  4) return 'exp';
    return 'fg';
  }

  function resolveOutcome(selfPick, answers) {
    const score = answers.reduce((a, b) => a + b, 0);
    const level = scoreToLevel(score);
    const key = `${selfPick}_${level}`;
    return RESULTS[key];
  }

  // ===========================================================
  // Render
  // ===========================================================

  const frame = document.getElementById('frame');

  function renderQ1() {
    const html = `
      <div class="screen active">
        ${renderProgress(1)}
        <h1 class="q-heading">${Q1.headline[0]} <span class="accent">${Q1.headline[1]}</span></h1>
        <p class="q-sub">${Q1.sub}</p>
        <div class="answer-grid">
          ${Q1.options.map((o, i) => `
            <button type="button" class="answer-card lvl-${o.cls}" data-pick="${o.value}" data-idx="${i}">
              <span class="pill"><span class="dot"></span>${o.pill}</span>
              <div class="title">${o.title}</div>
              <div class="desc">${o.desc}</div>
            </button>
          `).join('')}
        </div>
        <div class="keyhint">Tipp: Tasten <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> wählen direkt aus</div>
      </div>
    `;
    frame.innerHTML = html;
    bindQ1();
  }

  function renderFollowup(qIndex) {
    const q = QUESTIONS[qIndex];
    const stepNum = qIndex + 2; // Q2 entspricht Step 2
    const total = TOTAL_STEPS;
    const html = `
      <div class="screen active">
        ${renderProgress(stepNum)}
        <h1 class="q-heading">${q.headline[0]} <span class="accent">${q.headline[1]}</span></h1>
        <p class="q-sub">${q.sub}</p>
        <div class="answer-list">
          ${q.options.map((opt, i) => `
            <button type="button" class="answer-row" data-score="${opt.score}" data-idx="${i}">
              <div class="letter">${opt.letter}</div>
              <div class="text">${opt.text}</div>
            </button>
          `).join('')}
        </div>
        <div class="screen-footer">
          <button type="button" class="btn-back" data-back>← zurück</button>
          <span>Frage ${stepNum} von ${total}</span>
        </div>
        <div class="keyhint">Tasten <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> · <kbd>←</kbd> zurück</div>
      </div>
    `;
    frame.innerHTML = html;
    bindFollowup();
  }

  function renderResult() {
    const r = resolveOutcome(state.selfPick, state.answers);
    const html = `
      <div class="screen active">
        <div class="result">
          <div class="stamp ${r.level}"><span class="dot"></span>Dein Level</div>
          <h1 class="headline">${formatHeadline(r.headline, r.level)}</h1>
          ${r.qualifier ? `<p class="qualifier">${r.qualifier}</p>` : ''}
          <p class="body">${r.body}</p>
          <div class="cta-stack">
            <a class="cta-primary" href="${AKADEMIE_URL}" target="_top" rel="noopener">
              Zur Akademie <span class="arrow">→</span>
            </a>
            <div class="cta-secondary-row">
              <button type="button" class="btn-secondary" data-restart>Test wiederholen</button>
              <button type="button" class="btn-secondary" data-share>Ergebnis teilen</button>
            </div>
          </div>
        </div>
      </div>
    `;
    frame.innerHTML = html;
    bindResult(r);
  }

  function formatHeadline(text, levelCls) {
    // Erstes Vorkommen eines Level-Worts einfärben.
    const targets = ['Anfänger', 'Fortgeschritten', 'Experte'];
    for (const t of targets) {
      if (text.includes(t)) {
        return text.replace(t, `<span class="level-word ${levelCls}">${t}</span>`);
      }
    }
    return text;
  }

  function renderProgress(stepNum) {
    const pct = (stepNum / TOTAL_STEPS) * 100;
    return `
      <div class="progress">
        <span class="step">Schritt ${stepNum} / ${TOTAL_STEPS}</span>
        <div class="bar"><div class="fill" style="width: ${pct}%"></div></div>
      </div>
    `;
  }

  // ===========================================================
  // Event Bindings
  // ===========================================================

  function bindQ1() {
    document.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selfPick = btn.dataset.pick;
        state.answers = [];
        state.step = 1;
        renderFollowup(0);
      });
    });
  }

  function bindFollowup() {
    document.querySelectorAll('[data-score]').forEach(btn => {
      btn.addEventListener('click', () => {
        const score = parseInt(btn.dataset.score, 10);
        state.answers[state.step - 1] = score;
        state.step++;
        if (state.step <= QUESTIONS.length) {
          renderFollowup(state.step - 1);
        } else {
          renderResult();
        }
      });
    });
    const back = document.querySelector('[data-back]');
    if (back) back.addEventListener('click', goBack);
  }

  function bindResult(result) {
    document.querySelector('[data-restart]').addEventListener('click', restart);
    document.querySelector('[data-share]').addEventListener('click', () => shareResult(result));
  }

  function goBack() {
    if (state.step <= 1) {
      state.selfPick = null;
      state.answers = [];
      state.step = 0;
      renderQ1();
    } else {
      state.answers.pop();
      state.step--;
      renderFollowup(state.step - 1);
    }
  }

  function restart() {
    state.selfPick = null;
    state.answers = [];
    state.step = 0;
    renderQ1();
  }

  // ===========================================================
  // Sharing
  // ===========================================================

  async function shareResult(result) {
    const lvl = LEVELS[result.level].name;
    const text = `Mein KI-Level: ${lvl} — getestet bei der AI Performance Academy. Mach den Test: ${location.origin}${location.pathname}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Mein KI-Level', text });
        showToast('Geteilt');
      } else {
        await navigator.clipboard.writeText(text);
        showToast('In Zwischenablage kopiert');
      }
    } catch (e) {
      // User abgebrochen oder Permission denied — nichts tun
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ===========================================================
  // Tastatur
  // ===========================================================

  document.addEventListener('keydown', (e) => {
    if (['1', '2', '3'].includes(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      const buttons = document.querySelectorAll('[data-pick], [data-score]');
      if (buttons[idx]) {
        buttons[idx].click();
        e.preventDefault();
      }
    }
    if ((e.key === 'Backspace' || e.key === 'ArrowLeft') && state.step >= 1 && state.step <= QUESTIONS.length) {
      goBack();
      e.preventDefault();
    }
  });

  // ===========================================================
  // Start
  // ===========================================================

  renderQ1();
</script>

</body>
</html>
