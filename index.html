<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level-Test — AI Performance Academy</title>
<meta name="description" content="Finde in 8 Klicks heraus, wo du gerade mit KI stehst.">
<meta property="og:title" content="Level-Test — AI Performance Academy">
<meta property="og:description" content="Finde in 8 Klicks heraus, wo du gerade mit KI stehst.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'><path d='M 6 32 A 26 26 0 0 1 58 32' fill='none' stroke='%23000' stroke-width='3'/><path d='M 50 32 A 26 26 0 0 1 58 32 L 56 28 L 50 30 Z' fill='%23E10600'/><line x1='32' y1='32' x2='40' y2='14' stroke='%23000' stroke-width='2.5' stroke-linecap='round'/><circle cx='32' cy='32' r='2.5' fill='%23000'/></svg>">
<style>
  /* ═══════════════════════════════════════════════════════════
     LEVEL-TEST — F1-Fassung
     Bausteine aus dem AI-PA-Brandkit: Startampel, Sektorleiste,
     Nummernschild, Timing-Tower-Zeile, Zielflagge, Tacho-Gauge.
     Regeln: Ziffern wandern nicht (tabular-nums) · Rot ist
     rationiert (aktive Station, primärer CTA, Ergebnis-Bogen) ·
     Ein Hover für alles (translateY(-2px) + Standardschatten).
     ═══════════════════════════════════════════════════════════ */
  :root {
    --bg: #FAFAFA;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FBFCFD;
    --ink: #16161B;
    --slate: #34435C;
    --gray: #767D8C;
    --gray-light: #525968;
    --line: #E4E7EC;
    --line-soft: #EDF0F4;
    --white: #16161B;
    --white-muted: #1F2937;
    --primary: #FF1A1A;
    --primary-dark: #E00F0F;
    --anfaenger: #16A34A;
    --fortgeschritten: #D97706;
    --experte: #DC2626;
    --lift: rgba(31,31,31,.35) 0 8px 20px -8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--white-muted);
    line-height: 1.6;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--primary); color: #fff; }

  /* ═════ Bühne + Rahmen ═════ */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0 24px;
  }
  .frame {
    width: 100%;
    max-width: 780px;
    min-height: 640px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    /* Die scharfe linke obere Ecke ist das Marken-Motiv der Site. */
    border-radius: 0 18px 18px 18px;
    overflow: hidden;
    box-shadow: rgba(52,67,92,.14) 0 22px 60px -34px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ═════ Kopfleiste — Timing-Tower-Bauform ═════ */
  .tt-head {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 22px;
    background: var(--slate);
    overflow: hidden;
    flex-shrink: 0;
  }
  /* Speed-Slashes: Manual-Textur, sehr leise gehalten. */
  .tt-head::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg,
      transparent 0 14px, rgba(255,255,255,.055) 14px 16px);
    pointer-events: none;
  }
  .tt-head.finish { background: var(--ink); }
  .tt-head.finish::after {
    background: repeating-conic-gradient(rgba(255,255,255,.17) 0% 25%, transparent 0% 50%) 0 0/16px 16px;
    left: auto; width: 260px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 70%);
            mask-image: linear-gradient(90deg, transparent, #000 70%);
  }
  .tt-l {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: #fff; white-space: nowrap;
  }
  .tt-r {
    position: relative; z-index: 1;
    font-size: 12px; font-weight: 700; letter-spacing: .1em;
    color: rgba(255,255,255,.62);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tt-r b { color: #fff; font-weight: 700; }

  /* Startampel — drei geschrägte Lichter, füllen sich mit dem Fortschritt. */
  .sl { display: inline-flex; gap: 3px; }
  .sl i {
    display: block; width: 5px; height: 14px;
    transform: skewX(-16deg); border-radius: 1px;
    background: rgba(255,255,255,.22);
    transition: background .3s;
  }
  .sl i.on { background: var(--primary); }
  /* Am Ziel wird aus der Ampel ein Karofeld. */
  .sl.flag { width: 20px; height: 14px; transform: skewX(-16deg); overflow: hidden; border-radius: 1px;
             background: repeating-conic-gradient(#fff 0% 25%, #16161B 0% 50%) 0 0/7px 7px; }

  /* ═════ Sektorleiste — acht Segmente statt eines Balkens ═════ */
  .sectors {
    display: flex; gap: 3px;
    padding: 0; background: var(--line);
    flex-shrink: 0;
  }
  .sectors span {
    flex: 1; height: 4px;
    background: var(--line);
    transition: background .35s cubic-bezier(.4,0,.2,1);
  }
  .sectors span.done { background: var(--slate); }
  .sectors span.now  { background: var(--primary); }

  /* ═════ Karten-Innenraum ═════ */
  .body-pad {
    flex: 1;
    padding: 44px 48px 26px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .screen { display: none; animation: fadeIn .32s ease; }
  .screen.active { display: flex; flex-direction: column; flex: 1; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Q1: drei gleich große Lücken (Titel / Karten / Unterseite). */
  .screen.active:has(.answer-grid) .q-heading { margin-top: auto; }
  .screen.active:has(.answer-grid) .answer-grid { margin-top: auto; margin-bottom: auto; }
  .screen.active:has(.answer-grid) .keyhint {
    position: absolute; left: 0; right: 0; bottom: 22px; margin: 0;
  }
  /* Q2–Q8: Kopfgruppe / Antworten / Fuß gleichmäßig verteilt. */
  .screen.active:has(.answer-list) .q-heading   { margin-top: auto; }
  .screen.active:has(.answer-list) .answer-list { margin-top: auto; }
  .screen.active:has(.answer-list) .screen-footer { margin-top: auto; }
  .screen.active:has(.result) { justify-content: center; }

  /* ═════ Frage ═════ */
  .q-heading {
    font-size: clamp(1.5rem, 3.2vw, 2.1rem);
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -.02em;
    line-height: 1.14;
    margin: 0 0 12px;
  }
  .q-heading .accent { color: var(--primary); }
  .q-sub {
    font-size: 15.5px;
    color: var(--gray-light);
    margin: 0 0 28px;
    max-width: 60ch;
    font-weight: 400;
  }

  /* ═════ Q1 — Auswahlkarten in der Bauform der Site-Optionen ═════
     `.opt` der Startseite: 1px Rand #E3E6EA, Radius 10, Hover nur
     Randfarbe + zarter roter Grund. Auswahl-Elemente heben sich nicht
     an — so steht es in button-standard.css. */
  .answer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .answer-card {
    background: #fff;
    border: 1px solid #E3E6EA;
    border-radius: 10px;
    padding: 18px 18px 20px;
    cursor: pointer;
    transition: .14s;
    text-align: left; font-family: inherit; color: #1F1F1F;
    width: 100%;
    /* Buttons zentrieren ihren Inhalt von Haus aus — hier muss er oben
       anliegen, sonst rutschen kürzere Karten im Raster nach unten. */
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  }
  .answer-card:hover, .answer-card:focus-visible {
    border-color: var(--primary);
    background: #FFF4F4;
    outline: none;
  }
  .answer-card.lvl-anf { --lvl-color: var(--anfaenger); }
  .answer-card.lvl-fg  { --lvl-color: var(--fortgeschritten); }
  .answer-card.lvl-exp { --lvl-color: var(--experte); }

  /* Startlicht statt Kästchen — dieselbe Rolle wie `.opt .bx`,
     nur in der geschrägten Form aus dem Brandkit. */
  .light {
    display: block; width: 7px; height: 18px; flex: 0 0 auto;
    transform: skewX(-16deg); border-radius: 1px;
    background: #B9BFC9; transition: .14s;
  }
  .answer-card .slot-top { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .answer-card .light { background: var(--lvl-color); }
  .answer-card .lvl {
    font-size: 10.5px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: var(--lvl-color);
  }
  .answer-card .title {
    font-size: 16.5px; font-weight: 700; color: #16161B;
    letter-spacing: -.01em; margin-bottom: 7px; line-height: 1.25;
  }
  .answer-card .desc { font-size: 14px; color: var(--gray-light); line-height: 1.5; }

  /* ═════ Q2–Q8 — Antwortzeilen in der Bauform der Site-Optionen ═════
     Links das Startlicht, rechts die Rev-Leiste: die Optionen sind
     immer aufsteigend sortiert, die Leiste zeigt die Stufe. */
  .answer-list { display: flex; flex-direction: column; gap: 8px; }
  .answer-row {
    background: #fff;
    border: 1px solid #E3E6EA;
    border-radius: 10px;
    min-height: 50px;
    padding: 12px 16px;
    cursor: pointer;
    transition: .14s;
    display: grid; grid-template-columns: 7px minmax(0,1fr) 30px;
    align-items: center; gap: 13px;
    font-family: inherit; color: #1F1F1F;
    width: 100%; text-align: left;
  }
  .answer-row:hover, .answer-row:focus-visible {
    border-color: var(--primary);
    background: #FFF4F4;
    outline: none;
  }
  .answer-row:hover .light, .answer-row:focus-visible .light { background: var(--primary); }
  .answer-row .text {
    font-size: 15px; font-weight: 500; line-height: 1.35; color: #1F1F1F;
  }
  .answer-row:hover .text, .answer-row:focus-visible .text { font-weight: 700; color: #16161B; }
  .rev { display: flex; gap: 3px; align-items: flex-end; }
  .rev i { width: 6px; height: 6px; border-radius: 1px; background: #E8EBEF; transition: .14s; }
  .rev i:nth-child(2) { height: 10px; }
  .rev i:nth-child(3) { height: 14px; }
  .rev i.on { background: var(--slate); }
  .answer-row:hover .rev i.on, .answer-row:focus-visible .rev i.on { background: var(--primary); }

  /* ═════ Fußzeile der Frage ═════ */
  .screen-footer {
    margin-top: 26px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--gray); font-size: 11px;
    text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .btn-back {
    font-family: inherit;
    background: #fff; color: #1F1F1F;
    border: 1px solid #D9DDE3; border-radius: 999px;
    min-height: 40px; padding: 9px 20px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s, box-shadow .15s, border-color .15s, color .15s;
  }
  .btn-back:hover { transform: translateY(-2px); box-shadow: var(--lift); }

  /* ═════ Ergebnis ═════ */
  .result { text-align: center; padding: 8px 0 4px; }

  /* Tacho — das Logo-Motiv der Marke als Auswertung.
     Schwarzer Bogen = erreicht, roter Bogen = der nächste Schritt. */
  .gauge { width: 268px; margin: 0 auto 4px; }
  .gauge svg { display: block; width: 100%; height: auto; }
  /* Die Zahl sitzt per negativem Abstand im Bogen — kein Überlappen möglich. */
  .gauge .v {
    margin-top: -54px;
     font-size: 44px; font-weight: 700;
    color: var(--ink); line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .gauge .l {
    margin-top: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gray);
  }
  .zones {
    display: grid; grid-template-columns: repeat(3, 1fr);
    max-width: 340px; margin: 14px auto 22px;
    font-size: 9px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #A8AEBA;
  }
  .zones span.on { color: var(--ink); }

  .result .stamp {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 6px 8px 6px 6px; border-radius: 6px;
    background: var(--ink); color: #fff;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    margin-bottom: 16px;
  }
  .result .stamp .tag {
     font-size: 10px; font-weight: 700;
    padding: 3px 7px; border-radius: 3px; letter-spacing: .06em;
    background: rgba(255,255,255,.14);
  }
  .result .stamp.anf .tag { background: var(--anfaenger); }
  .result .stamp.fg  .tag { background: var(--fortgeschritten); }
  .result .stamp.exp .tag { background: var(--experte); }
  .result .stamp .txt { padding-right: 6px; }

  .result .headline {
    font-size: clamp(1.7rem, 3.8vw, 2.5rem);
    font-weight: 900; color: var(--ink);
    letter-spacing: -.025em; line-height: 1.1;
    margin: 0 0 12px; max-width: 22ch;
    margin-left: auto; margin-right: auto;
  }
  .result .headline .level-word.anf { color: var(--anfaenger); }
  .result .headline .level-word.fg  { color: var(--fortgeschritten); }
  .result .headline .level-word.exp { color: var(--experte); }
  .result .qualifier {
    font-size: 16px; color: var(--gray-light); font-weight: 600;
    margin: 0 auto 14px; max-width: 56ch;
  }
  .result .body {
    font-size: 15.5px; color: var(--gray-light);
    max-width: 58ch; margin: 0 auto 18px; line-height: 1.6; font-weight: 400;
  }
  /* Meta-Zeile: der einzige Ort für Zahlen und Middots. */
  .metaline {
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: #8A919F;
    margin: 0 0 24px; font-variant-numeric: tabular-nums;
  }

  /* ═════ Knöpfe — Site-Standard, ein Hover für alles ═════
     Anordnung wie im CTA-Kasten der Methode-Seite: primär und sekundär
     nebeneinander in einer Reihe, das Nachrangige als Textlink darunter. */
  .cta-row {
    display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap;
  }
  .cta-primary {
    font-family: inherit;
    background: var(--primary); color: #fff; border: none;
    min-height: 52px; padding: 14px 30px;
    font-size: 16px; font-weight: 700; line-height: 1.2;
    border-radius: 999px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .cta-primary:hover { transform: translateY(-2px); box-shadow: var(--lift); }
  /* Der weiße Punkt ist das `btn-r`-Detail der Site. */
  .cta-primary .dot { width: 7px; height: 7px; border-radius: 999px; background: #fff; flex: 0 0 auto; }
  .cta-primary .ar { display: inline-block; transition: transform .15s; }
  .cta-primary:hover .ar { transform: translateX(3px); }

  .btn-secondary {
    font-family: inherit;
    background: #fff; color: #1F1F1F; border: 1px solid #D9DDE3;
    min-height: 52px; padding: 14px 28px;
    font-size: 16px; font-weight: 700; line-height: 1.2;
    border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s, box-shadow .15s, border-color .15s, color .15s;
  }
  .btn-secondary:hover { transform: translateY(-2px); box-shadow: var(--lift); }

  /* Nachrangig: Textlink statt drittem Knopf. */
  .cta-note {
    display: block; margin-top: 18px;
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 13.5px; color: var(--gray);
    margin-left: auto; margin-right: auto;
  }
  .cta-note b { font-weight: 600; color: #1F1F1F; text-decoration: underline; }
  .cta-note:hover b { color: var(--primary); }

  /* ═════ Toast ═════ */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink); border: none; color: #fff;
    padding: 12px 20px; border-radius: 0 10px 10px 10px;
    font-size: 14px; font-weight: 600;
    box-shadow: rgba(15,23,42,.22) 0 10px 30px -10px;
    z-index: 200;
    transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s;
    opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ═════ Tastaturhinweis ═════ */
  .keyhint {
    text-align: center; margin-top: 16px;
    font-size: 10.5px; color: #A8AEBA;
    text-transform: uppercase; letter-spacing: .12em;
  }
  .keyhint kbd {
    display: inline-block; padding: 2px 6px;
    background: #F2F4F7; border: 1px solid var(--line); border-radius: 4px;
     font-size: 10px; color: var(--gray-light);
    margin: 0 1px;
  }

  /* ═════ Laptops mit niedriger Bildschirmhöhe ═════ */
  @media (max-height: 1000px) and (min-width: 721px) {
    .stage { padding: 0 24px; align-items: flex-start; }
    .frame { min-height: 560px; }
    .body-pad { padding: 32px 42px 22px; }
    .q-heading { font-size: clamp(1.4rem, 2.6vw, 1.8rem); }
    .q-sub { font-size: 15px; margin-bottom: 22px; }
    .answer-card { padding: 15px 15px 17px; }
    .answer-card .slot-top { margin-bottom: 10px; }
    .answer-card .title { font-size: 15.5px; margin-bottom: 6px; }
    .answer-card .desc { font-size: 13.5px; }
    .answer-row { min-height: 46px; padding: 10px 14px; }
    .answer-row .text { font-size: 14.5px; }
    .screen-footer { margin-top: 20px; }
    .keyhint { margin-top: 12px; }
    .result { padding: 2px 0 0; }
    .gauge { width: 226px; }
    .gauge .v { font-size: 36px; margin-top: -44px; }
    .zones { margin-bottom: 16px; }
    .result .stamp { margin-bottom: 12px; }
    .result .headline { font-size: clamp(1.55rem, 3.2vw, 2.15rem); margin-bottom: 10px; }
    .result .qualifier { font-size: 15px; margin-bottom: 12px; }
    .result .body { font-size: 15px; margin-bottom: 14px; }
    .metaline { margin-bottom: 18px; }
  }

  /* ═════ Sehr flache Bildschirme ═════ */
  @media (max-height: 740px) and (min-width: 721px) {
    .stage { padding: 18px 24px; }
    .frame { min-height: 460px; }
    .body-pad { padding: 22px 32px 18px; }
    .q-heading { font-size: clamp(1.15rem, 2vw, 1.4rem); }
    .q-sub { font-size: 13.5px; margin-bottom: 14px; }
    .answer-card { padding: 12px 12px 14px; }
    .answer-card .desc { font-size: 13px; }
    .answer-row { min-height: 42px; padding: 8px 13px; }
    .answer-row .text { font-size: 14px; }
    .gauge { width: 186px; }
    .gauge .v { font-size: 30px; margin-top: -36px; }
    .keyhint { display: none; }
  }

  /* ═════ Mobil ═════ */
  @media (max-width: 720px) {
    body { font-size: 16px; }
    .stage { padding: 0; }
    .frame { border-radius: 0; border-left: none; border-right: none; }
    .tt-head { padding: 12px 20px; }
    .body-pad { padding: 30px 22px 26px; }
    .answer-grid { grid-template-columns: 1fr; gap: 10px; }
    .answer-card { padding: 16px 16px 18px; }
    .q-heading { font-size: 1.55rem; }
    .q-sub { font-size: 15.5px; }
    .answer-row { padding: 13px 15px; gap: 12px; }
    .answer-row .text { font-size: 15.5px; }
    .gauge { width: 224px; }
    .gauge .v { font-size: 36px; margin-top: -44px; }
    .zones { max-width: 300px; font-size: 8.5px; }
    .result .body { font-size: 15.5px; }
    .result .qualifier { font-size: 16px; }
    .cta-row { flex-direction: column; gap: 10px; }
    .cta-primary, .btn-secondary { width: 100%; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <div class="tt-head" id="tt-head"></div>
    <div class="sectors" id="sectors"></div>
    <div class="body-pad" id="frame"></div>
  </div>
</div>

<div class="toast" id="toast">Ergebnis kopiert</div>

<script>
  // ===========================================================
  // Konstanten
  // ===========================================================

  const TOTAL_STEPS = 8;          // 1 Splitter + 7 Folgefragen
  const AKADEMIE_URL = 'https://ai-pa.ai/sutherland/#finder';

  // short = Dreibuchstaben-Kürzel für die Ergebnis-Plakette (Timing-Anzeige).
  const LEVELS = {
    anf: { name: 'Anfänger',        cls: 'anf', short: 'ANF' },
    fg:  { name: 'Fortgeschritten', cls: 'fg',  short: 'FGS' },
    exp: { name: 'Experte',         cls: 'exp', short: 'EXP' }
  };

  // Q1 — Selbsteinschätzung als Hypothese
  const Q1 = {
    headline: ['Wo siehst du dich gerade', 'mit KI?'],
    sub: 'Stuf dich grob ein — am Ende prüfen wir, ob du richtig liegst.',
    options: [
      { cls: 'anf', pill: 'Anfänger',       title: 'Ich fange gerade an',  desc: 'Wenig oder keine Erfahrung mit KI — ich will wissen, wie ich starte.', value: 'anf' },
      { cls: 'fg',  pill: 'Fortgeschritten', title: 'Ich nutze KI bereits', desc: 'Ich arbeite damit, will aber systematisch besser werden.',              value: 'fg'  },
      { cls: 'exp', pill: 'Experte',         title: 'Ich gehe in die Tiefe', desc: 'Ich arbeite tief mit KI und will mich spezialisieren.',                 value: 'exp' }
    ]
  };

  // Q2–Q8 — universelle Folgefragen für alle, mit progressiver Tiefe
  const QUESTIONS = [
    // Q2 — Frequenz (Komfort)
    {
      headline: ['Wie oft nutzt du KI', 'in deinem Alltag?'],
      sub: 'Eine Frage, eine Antwort — direkt zur nächsten.',
      options: [
        { letter: 'A', text: 'Selten — ich habe es ab und zu probiert',   score: -1 },
        { letter: 'B', text: 'Mehrmals pro Woche, je nach Aufgabe',       score:  0 },
        { letter: 'C', text: 'Täglich, fast in jedem Arbeitsblock',       score:  1 }
      ]
    },
    // Q3 — Tool-Vielfalt (Komfort)
    {
      headline: ['Mit wie vielen KI-Tools', 'arbeitest du regelmäßig?'],
      sub: 'Nebeneinander, je nach Aufgabe.',
      options: [
        { letter: 'A', text: 'Eines, meist ChatGPT',                              score: -1 },
        { letter: 'B', text: 'Zwei oder drei, je nach Zweck',                     score:  0 },
        { letter: 'C', text: 'Vier oder mehr — jedes mit klarem Use Case',        score:  1 }
      ]
    },
    // Q4 — Prompt-Qualität (Erste Tiefe)
    {
      headline: ['Wie schreibst du', 'einen typischen Prompt?'],
      sub: 'Wie viel Struktur gibst du der KI mit auf den Weg?',
      options: [
        { letter: 'A', text: 'So, wie ich die Frage einem Kollegen stellen würde',         score: -1 },
        { letter: 'B', text: 'Mit etwas Kontext, manchmal Beispielen',                     score:  0 },
        { letter: 'C', text: 'Mit Rolle, Kontext, Beispielen und gewünschtem Format',      score:  1 }
      ]
    },
    // Q5 — Output-Validierung (Erste Tiefe)
    {
      headline: ['Wenn KI dir antwortet —', 'was machst du damit?'],
      sub: 'Vertrauen, prüfen, gegenchecken — wie ist deine Routine?',
      options: [
        { letter: 'A', text: 'Ich übernehme sie meistens direkt',                  score: -1 },
        { letter: 'B', text: 'Ich überfliege und prüfe stichprobenartig',          score:  0 },
        { letter: 'C', text: 'Ich habe feste Prüfschritte — Quellen, Gegenproben', score:  1 }
      ]
    },
    // Q6 — Kontext-Setup (Differenzierer)
    {
      headline: ['Arbeitest du mit', 'System Prompts oder Projects?'],
      sub: 'Also: Gibst du der KI feste Regeln und Wissen mit, bevor du loslegst?',
      options: [
        { letter: 'A', text: 'Davon habe ich noch nicht gehört',         score: -1 },
        { letter: 'B', text: 'Manchmal, für wiederkehrende Themen',      score:  0 },
        { letter: 'C', text: 'Ja, feste Setups pro Use Case',            score:  1 }
      ]
    },
    // Q7 — Workflow-Automation (Differenzierer)
    {
      headline: ['Hast du eigene Workflows', 'oder Automationen gebaut?'],
      sub: 'z. B. mit n8n, Zapier, Make oder Custom Skills — etwas, das wiederholt für dich arbeitet.',
      options: [
        { letter: 'A', text: 'Noch nicht — ich nutze KI im Chat',                     score: -1 },
        { letter: 'B', text: 'Erste Versuche, einzelne Sachen funktionieren',         score:  0 },
        { letter: 'C', text: 'Ja, läuft produktiv und spart messbar Zeit',            score:  1 }
      ]
    },
    // Q8 — Eigene Werkzeuge & Agenten (Experten-Schicht)
    {
      headline: ['Hast du eigene KI-Werkzeuge', 'oder Agenten gebaut?'],
      sub: 'z. B. Custom Skills, MCP-Server, Multi-Agent-Setups — Tools, die deine KI bekommt, statt nur fertige Apps zu nutzen.',
      options: [
        { letter: 'A', text: 'Habe ich noch nicht gehört',                  score: -1 },
        { letter: 'B', text: 'Habe es probiert, einzelne Sachen laufen',    score:  0 },
        { letter: 'C', text: 'Ja, mehrere Agenten produktiv im Einsatz',    score:  1 }
      ]
    }
  ];

  // ===========================================================
  // Outcomes — 9 Varianten (selfPick × actualLevel)
  // Schwellen: score ≤ −3 → anf, −2..+3 → fg, ≥ +4 → exp
  // ===========================================================

  const RESULTS = {
    // Diagonale: Selbsteinschätzung trifft zu
    anf_anf: { level: 'anf', headline: 'Du hattest recht — du bist Anfänger.',           qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Der richtige Startpunkt, um KI systematisch und ohne Umwege zu lernen. Du weißt, wo du stehst — das ist die halbe Miete.' },
    fg_fg:   { level: 'fg',  headline: 'Du hattest recht — du bist Fortgeschritten.',     qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Du nutzt KI bereits und kennst die Kerntechniken. Jetzt geht’s um Tiefe und die Anwendung in deinen eigenen Prozessen.' },
    exp_exp: { level: 'exp', headline: 'Du hattest recht — du bist Experte.',             qualifier: 'Saubere Selbsteinschätzung.',
               body: 'Du arbeitest tief mit KI, baust eigene Systeme und gibst Wissen weiter. Jetzt geht’s um Spezialisierung — Multi-Agent, Custom Skills, KI-Strategie auf höchster Ebene.' },

    // Untertrieben: Du bist weiter, als du dachtest
    anf_fg:  { level: 'fg',  headline: 'Du bist weiter, als du dachtest — Fortgeschritten.', qualifier: 'Mehr drauf, als deine Selbsteinschätzung vermuten ließ.',
               body: 'Einige Bausteine hast du längst im Griff. Auf dem Fortgeschritten-Weg holst du gezielt das raus, was den nächsten Schritt ausmacht.' },
    anf_exp: { level: 'exp', headline: 'Riesige Überraschung — du bist eigentlich Experte.', qualifier: 'Selten gesehen: Du hast dich deutlich unterschätzt.',
               body: 'Was du im Alltag tust, ist Experten-Niveau — Agenten, eigene Tools, klare Setups. Du brauchst keinen Einstieg, du brauchst Spezialisierung.' },
    fg_exp:  { level: 'exp', headline: 'Du bist weiter, als du dachtest — Experte.',         qualifier: 'Deine Selbsteinschätzung war zu bescheiden.',
               body: 'Du orchestrierst Agenten, baust eigene Werkzeuge und kennst die fortgeschrittenen Techniken aus dem Effeff. Der Experten-Weg holt aus dir mehr raus.' },

    // Überschätzt: würdig, ohne „du lagst falsch"
    fg_anf:  { level: 'anf', headline: 'Du bringst Anspruch mit — im Alltag stehst du noch auf Anfänger-Niveau.', qualifier: 'Du arbeitest mit KI, der systematische Aufbau fehlt aber noch.',
               body: 'Genau der richtige Punkt, um Grundlagen sauber aufzubauen. Mit deinem Mindset und ein bisschen Struktur wirst du sehr schnell sehr weit kommen.' },
    exp_anf: { level: 'anf', headline: 'Du bist Anfänger — mit dem Anspruch eines Experten.', qualifier: 'Im Alltag stehst du gerade noch im Aufbau.',
               body: 'Genau hier hat ein systematischer Einstieg den größten Hebel. Mit deinem Anspruch wirst du den Weg zum Experten viel schneller gehen als die meisten.' },
    exp_fg:  { level: 'fg',  headline: 'Aktuell bist du Fortgeschritten.',                    qualifier: 'In einigen Bereichen bist du schon weit — der Sprung zum Experten steht bevor.',
               body: 'Die Basis ist da. Was noch fehlt, sind die letzten Bausteine — eigene Werkzeuge, Multi-Agent, strategische Tiefe. Dort holst du gezielt das raus, was den Sprung ausmacht.' }
  };

  // ===========================================================
  // State
  // ===========================================================

  const state = {
    selfPick: null,    // 'anf' | 'fg' | 'exp'
    answers: [],       // Array<-1|0|1>, Länge bis zu 7
    step: 0            // 0 = Q1; 1..7 = Q2..Q8; 8 = Result
  };

  // ===========================================================
  // Logik: Score → Level → Outcome
  // ===========================================================

  function scoreToLevel(score) {
    if (score <= -3) return 'anf';
    if (score >=  4) return 'exp';
    return 'fg';
  }

  function resolveOutcome(selfPick, answers) {
    const score = answers.reduce((a, b) => a + b, 0);
    const level = scoreToLevel(score);
    const key = `${selfPick}_${level}`;
    return { ...RESULTS[key], score };
  }

  // Rohscore (−7 … +7 über sieben Fragen) auf eine Tachozahl 0–100 abbilden.
  const SCORE_MIN = -QUESTIONS.length, SCORE_MAX = QUESTIONS.length;
  function scoreToValue(score) {
    return Math.round((score - SCORE_MIN) / (SCORE_MAX - SCORE_MIN) * 100);
  }
  // Level-Schwellen auf derselben Skala — sie markieren die Zonen im Tacho.
  const ZONE_FG  = scoreToValue(-2);   // ab hier Fortgeschritten
  const ZONE_EXP = scoreToValue(4);    // ab hier Experte

  // ===========================================================
  // Render
  // ===========================================================

  const frame = document.getElementById('frame');

  function renderQ1() {
    renderChrome(1);
    frame.innerHTML = `
      <div class="screen active">
        <h1 class="q-heading">${Q1.headline[0]} <span class="accent">${Q1.headline[1]}</span></h1>
        <p class="q-sub">${Q1.sub}</p>
        <div class="answer-grid">
          ${Q1.options.map((o, i) => `
            <button type="button" class="answer-card lvl-${o.cls}" data-pick="${o.value}" data-idx="${i}">
              <span class="slot-top">
                <span class="light"></span>
                <span class="lvl">${o.pill}</span>
              </span>
              <div class="title">${o.title}</div>
              <div class="desc">${o.desc}</div>
            </button>
          `).join('')}
        </div>
        <div class="keyhint">Tasten <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> wählen direkt aus</div>
      </div>
    `;
    bindQ1();
  }

  function renderFollowup(qIndex) {
    const q = QUESTIONS[qIndex];
    const stepNum = qIndex + 2; // Q2 entspricht Step 2
    renderChrome(stepNum);
    frame.innerHTML = `
      <div class="screen active">
        <h1 class="q-heading">${q.headline[0]} <span class="accent">${q.headline[1]}</span></h1>
        <p class="q-sub">${q.sub}</p>
        <div class="answer-list">
          ${q.options.map((opt, i) => `
            <button type="button" class="answer-row" data-score="${opt.score}" data-idx="${i}">
              <span class="light"></span>
              <span class="text">${opt.text}</span>
              <span class="rev">${[0, 1, 2].map(b => `<i class="${b <= i ? 'on' : ''}"></i>`).join('')}</span>
            </button>
          `).join('')}
        </div>
        <div class="screen-footer">
          <button type="button" class="btn-back" data-back>← zurück</button>
          <span>Sektor ${pad(stepNum)} / ${pad(TOTAL_STEPS)}</span>
        </div>
        <div class="keyhint">Tasten <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> · <kbd>←</kbd> zurück</div>
      </div>
    `;
    bindFollowup();
  }

  function renderResult() {
    const r = resolveOutcome(state.selfPick, state.answers);
    const value = scoreToValue(r.score);
    renderChrome(TOTAL_STEPS, true);
    frame.innerHTML = `
      <div class="screen active">
        <div class="result">
          ${renderGauge(value)}
          <div class="zones">
            <span class="${r.level === 'anf' ? 'on' : ''}">Anfänger</span>
            <span class="${r.level === 'fg'  ? 'on' : ''}">Fortgeschritten</span>
            <span class="${r.level === 'exp' ? 'on' : ''}">Experte</span>
          </div>
          <div class="stamp ${r.level}">
            <span class="tag">${LEVELS[r.level].short}</span>
            <span class="txt">Dein Level</span>
          </div>
          <h1 class="headline">${formatHeadline(r.headline, r.level)}</h1>
          ${r.qualifier ? `<p class="qualifier">${r.qualifier}</p>` : ''}
          <p class="body">${r.body}</p>
          <div class="metaline">Selbst-Check · ${pad(TOTAL_STEPS)} Fragen · ${LEVELS[r.level].name} · ${value} / 100</div>
          <div class="cta-row">
            <a class="cta-primary" href="${AKADEMIE_URL}" target="_top" rel="noopener">
              <span class="dot"></span>Zum Kursfinder <span class="ar">→</span>
            </a>
            <button type="button" class="btn-secondary" data-share>Ergebnis teilen</button>
          </div>
          <button type="button" class="cta-note" data-restart>oder <b>den Test wiederholen</b> ↺</button>
        </div>
      </div>
    `;
    bindResult(r);
  }

  // ===========================================================
  // Tacho — das Logo-Motiv der Marke als Auswertung.
  // Schwarzer Bogen: erreicht. Roter Bogen: der nächste Schritt.
  // Zwei feine Marken zeigen, wo die Level-Zonen anfangen.
  // ===========================================================

  const G = { cx: 100, cy: 110, r: 80 };   // Halbkreis, Mittelpunkt unten

  function gaugePoint(pct, radius) {
    const rad = Math.PI * (1 - pct / 100);
    return [G.cx + radius * Math.cos(rad), G.cy - radius * Math.sin(rad)];
  }

  function gaugeArc(fromPct, toPct, radius) {
    const [x1, y1] = gaugePoint(fromPct, radius);
    const [x2, y2] = gaugePoint(toPct, radius);
    // Der ganze Tacho umspannt 180°, jeder Teilbogen ist also nie größer
    // als ein Halbkreis — large-arc-flag muss durchgehend 0 bleiben.
    return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${radius} ${radius} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  }

  function gaugeTick(pct) {
    const [x1, y1] = gaugePoint(pct, G.r - 8);
    const [x2, y2] = gaugePoint(pct, G.r + 8);
    return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"
              stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>`;
  }

  function renderGauge(value) {
    const v = Math.max(0, Math.min(100, value));
    // Bei 0 bzw. 100 entfällt einer der beiden Bögen — sonst zeichnet SVG einen Punkt.
    const reached = v > 0.5  ? `<path d="${gaugeArc(0, v, G.r)}" fill="none" stroke="#1F1F1F" stroke-width="15" stroke-linecap="round"/>` : '';
    const ahead   = v < 99.5 ? `<path d="${gaugeArc(v, 100, G.r)}" fill="none" stroke="#FF1A1A" stroke-width="15" stroke-linecap="round"/>` : '';
    return `
      <div class="gauge">
        <svg viewBox="0 0 200 119" role="img" aria-label="Dein Wert: ${v} von 100">
          <path d="${gaugeArc(0, 100, G.r)}" fill="none" stroke="#E4E7EC" stroke-width="15" stroke-linecap="round"/>
          ${reached}
          ${ahead}
          ${gaugeTick(ZONE_FG)}
          ${gaugeTick(ZONE_EXP)}
        </svg>
        <div class="v">${v}</div>
        <div class="l">von 100</div>
      </div>
    `;
  }

  function formatHeadline(text, levelCls) {
    // Erstes Vorkommen eines Level-Worts einfärben.
    const targets = ['Anfänger', 'Fortgeschritten', 'Experte'];
    for (const t of targets) {
      if (text.includes(t)) {
        return text.replace(t, `<span class="level-word ${levelCls}">${t}</span>`);
      }
    }
    return text;
  }

  // ===========================================================
  // Kopfleiste (Timing-Tower) + Sektorleiste
  // ===========================================================

  const head    = document.getElementById('tt-head');
  const sectors = document.getElementById('sectors');

  const pad = n => String(n).padStart(2, '0');

  function renderChrome(stepNum, finish = false) {
    // Startampel: ein Licht pro Drittel des Wegs.
    const lights = finish
      ? '<span class="sl flag"></span>'
      : `<span class="sl">${[1, 2, 3]
          .map(i => `<i class="${stepNum / TOTAL_STEPS >= i / 3 ? 'on' : ''}"></i>`)
          .join('')}</span>`;

    head.className = 'tt-head' + (finish ? ' finish' : '');
    head.innerHTML = `
      <span class="tt-l">${lights}${finish ? 'Zielflagge' : 'Level-Test'}</span>
      <span class="tt-r">${finish ? '<b>Ergebnis</b>' : `<b>${pad(stepNum)}</b> / ${pad(TOTAL_STEPS)}`}</span>
    `;

    sectors.innerHTML = Array.from({ length: TOTAL_STEPS }, (_, i) => {
      const n = i + 1;
      const cls = finish || n < stepNum ? 'done' : (n === stepNum ? 'now' : '');
      return `<span class="${cls}"></span>`;
    }).join('');
  }

  // ===========================================================
  // Event Bindings
  // ===========================================================

  function bindQ1() {
    document.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selfPick = btn.dataset.pick;
        state.answers = [];
        state.step = 1;
        renderFollowup(0);
      });
    });
  }

  function bindFollowup() {
    document.querySelectorAll('[data-score]').forEach(btn => {
      btn.addEventListener('click', () => {
        const score = parseInt(btn.dataset.score, 10);
        state.answers[state.step - 1] = score;
        state.step++;
        if (state.step <= QUESTIONS.length) {
          renderFollowup(state.step - 1);
        } else {
          renderResult();
        }
      });
    });
    const back = document.querySelector('[data-back]');
    if (back) back.addEventListener('click', goBack);
  }

  function bindResult(result) {
    document.querySelector('[data-restart]').addEventListener('click', restart);
    document.querySelector('[data-share]').addEventListener('click', () => shareResult(result));
  }

  function goBack() {
    if (state.step <= 1) {
      state.selfPick = null;
      state.answers = [];
      state.step = 0;
      renderQ1();
    } else {
      state.answers.pop();
      state.step--;
      renderFollowup(state.step - 1);
    }
  }

  function restart() {
    state.selfPick = null;
    state.answers = [];
    state.step = 0;
    renderQ1();
  }

  // ===========================================================
  // Sharing
  // ===========================================================

  async function shareResult(result) {
    const lvl = LEVELS[result.level].name;
    const text = `Mein KI-Level: ${lvl} — getestet bei der AI Performance Academy. Mach den Test: ${location.origin}${location.pathname}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Mein KI-Level', text });
        showToast('Geteilt');
      } else {
        await navigator.clipboard.writeText(text);
        showToast('In Zwischenablage kopiert');
      }
    } catch (e) {
      // User abgebrochen oder Permission denied — nichts tun
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ===========================================================
  // Tastatur
  // ===========================================================

  document.addEventListener('keydown', (e) => {
    if (['1', '2', '3'].includes(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      const buttons = document.querySelectorAll('[data-pick], [data-score]');
      if (buttons[idx]) {
        buttons[idx].click();
        e.preventDefault();
      }
    }
    if ((e.key === 'Backspace' || e.key === 'ArrowLeft') && state.step >= 1 && state.step <= QUESTIONS.length) {
      goBack();
      e.preventDefault();
    }
  });

  // ===========================================================
  // Start
  // ===========================================================

  renderQ1();
</script>

</body>
</html>
